name: CI
on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build .
      - name: Windows build
        run: GOOS=windows go vet ./... && GOOS=windows go build -o /dev/null .
      # The installer is a module of its own, for macOS and Windows only.
      - name: Installer
        if: matrix.os == 'macos-latest'
        working-directory: installer
        run: |
          go vet -tags desktop,production ./...
          go test -tags desktop,production ./...
          GOOS=windows go vet -tags desktop,production ./...

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart/fdev_log
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test
